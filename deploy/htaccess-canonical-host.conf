# === E-TAXI: kanonická doména (vložiť NA ZAČIATOK ~/public_html/.htaccess, nad blok CLOUDLINUX PASSENGER) ===
# http -> https a www./mail. -> e-taxike.sk, jedným 301 skokom, so zachovanou cestou aj ?parametrami.
# Výnimka /.well-known/ kvôli AutoSSL (Let's Encrypt/Sectigo overovanie cez http).
# Bloky "DO NOT REMOVE" od CloudLinux/cPanel nemeniť.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteCond %{HTTPS} !=on [OR]
RewriteCond %{HTTP_HOST} !^e-taxike\.sk(:443)?$ [NC]
RewriteRule ^ https://e-taxike.sk%{REQUEST_URI} [R=301,L,NE]
</IfModule>
# === koniec E-TAXI ===
